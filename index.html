        * {

        .logo {

        .weer {

<body>

    <!-- HEADER -->
    <header>

        <!-- NAAM -->
        <div class="logo">
            Hugo T
        </div>

        <!-- ACTUEEL WEER LEIDEN -->
        <div class="weer">
            <div class="weer-titel">
                🌤️ Leiden
            </div>

            <div class="weer-info" id="weerInfo">
                Weer laden...
            </div>
        </div>

        <!-- ZOEKBALK -->
        <form class="zoek-container" onsubmit="zoekGoogle(event)">

            <input
                type="text"
                id="zoekInput"
                class="zoek-input"
                placeholder="Zoeken..."
                autocomplete="off"
            >

            <button
                type="submit"
                class="zoek-knop"
                aria-label="Zoeken">
                🔍
            </button>

        </form>

        <!-- MENU -->
        <div class="menu-container">

            <div class="menu" tabindex="0">
                MENU ☰
            </div>

            <!-- DROPDOWNMENU -->
            <div class="dropdown">
                <a href="binair.html">Binair stelsel</a>
            </div>

        </div>

    </header>

    <!-- HOOFDGEDEELTE -->
    <main class="achtergrond">

        <div class="content">
            <h1>Welkom</h1>

            <p>
                Op mijn website
            </p>
        </div>

        <!-- BERGEN MET ZONSONDERGANG -->
        <div class="afbeelding"></div>

    </main>

    <!-- SCRIPTS -->
    <script>

        /* GOOGLE ZOEKEN */
        function zoekGoogle(event) {

            event.preventDefault();

            const zoekopdracht =
                document.getElementById("zoekInput").value.trim();

            if (zoekopdracht !== "") {

                window.open(
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(zoekopdracht),
                    "_blank"
                );

            }
        }

        /* WEER */
        async function laadWeer() {

            const latitude = 52.1601;
            const longitude = 4.4970;

            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=Europe%2FAmsterdam`;

            try {

                const response = await fetch(url);
                const data = await response.json();
                const weer = data.current;

                const temperatuur =
                    Math.round(weer.temperature_2m);

                const gevoel =
                    Math.round(weer.apparent_temperature);

                const wind =
                    Math.round(weer.wind_speed_10m);

                const code = weer.weather_code;

                let omschrijving = "Onbekend";
                let emoji = "🌤️";

                if (code === 0) {
                    omschrijving = "Onbewolkt";
                    emoji = "☀️";
                }

                else if (code <= 3) {
                    omschrijving = "Bewolkt";
                    emoji = "🌤️";
                }

                else if (code <= 48) {
                    omschrijving = "Mistig";
                    emoji = "🌫️";
                }

                else if (code <= 67) {
                    omschrijving = "Regen";
                    emoji = "🌧️";
                }

                else if (code <= 77) {
                    omschrijving = "Sneeuw";
                    emoji = "❄️";
                }

                else if (code <= 82) {
                    omschrijving = "Buien";
                    emoji = "🌦️";
                }

                else if (code <= 99) {
                    omschrijving = "Onweer";
                    emoji = "⛈️";
                }

                document.getElementById("weerInfo").innerHTML =
                    `${emoji} ${temperatuur}°C · ${omschrijving}<br>
                    Gevoel ${gevoel}°C · Wind ${wind} km/u`;

            }

            catch (error) {

                document.getElementById("weerInfo").innerHTML =
                    "Weer tijdelijk niet beschikbaar";

            }
        }

        laadWeer();

        // Vernieuw het weer iedere 10 minuten
        setInterval(laadWeer, 600000);

    </script>

</body>
</html>
