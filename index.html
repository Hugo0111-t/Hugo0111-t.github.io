<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Website</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #dff3ff;
            min-height: 100vh;
        }

        /* HEADER */
        header {
            height: 90px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 2px solid #ddd;
        }

        .logo {
            background-color: #e9e9e9;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
        }

        .menu {
            background-color: #e9e9e9;
            padding: 15px 30px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ACHTERGROND */
        .achtergrond {
            min-height: 600px;
            padding: 60px;
            position: relative;
            background: linear-gradient(
                rgba(190, 230, 255, 0.7),
                rgba(220, 245, 255, 0.9)
            );
        }

        .content {
            text-align: center;
            margin-top: 50px;
        }

        .content h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .content p {
            font-size: 20px;
        }

        /* GROTE KAART / AFBEELDING */
        .afbeelding {
            position: absolute;
            right: 60px;
            bottom: 70px;
            width: 350px;
            height: 220px;
            background-color: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;
        }

        /* FOOTER */
        footer {
            position: absolute;
            left: 40px;
            bottom: 20px;
            background-color: white;
            padding: 25px 35px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            LOGO
        </div>

        <div class="menu">
            MENU ☰
        </div>
    </header>


    <main class="achtergrond">

        <div class="content">
            <h1>Welkom!</h1>
            <p>Dit is mijn website</p>
        </div>

        <div class="afbeelding">
            AFBEELDING
        </div>

        <footer>
            Footer<br>
            © 2026 Mijn Website
        </footer>

    </main>

</body>
</html>
